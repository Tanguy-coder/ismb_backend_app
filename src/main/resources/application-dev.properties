# Profil développement
# Les propriétés communes doivent rester dans application.properties (non versionné).

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ismb_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=root
spring.datasource.password=tanguydev
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

security.jwt.secret=${JWT_SECRET:ChangeMeForDevelopmentOnly}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

logging.level.com.tanguydev.ismb=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.devtools.restart.enabled=true
