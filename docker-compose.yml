services:
  app:
    build: .
    container_name: ismb_backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/ismb_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - db
    volumes:
      - ./uploads:/app/uploads
    networks:
      - ismb-network

  db:
    image: mysql:8.0
    container_name: ismb_db
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=ismb_db
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - ismb-network
    command: --default-authentication-plugin=mysql_native_password

volumes:
  db_data:

networks:
  ismb-network:
    driver: bridge
