#-------------------------------------------------------------------------------#
#        Discover additional configuration options in our documentation         #
#              https://www.jetbrains.com/help/qodana/gitlab.html                #
#-------------------------------------------------------------------------------#

include:
  - component: $CI_SERVER_FQDN/qodana/qodana/qodana-gitlab-ci@v2025.2
    inputs:
      # When mr-mode is set to true, Qodana analyzes only the files that have been changed
      mr-mode: false
      use-caches: true
      post-mr-comment: true
      # Upload Qodana results (SARIF, other artifacts, logs) as an artifact to the job
      upload-result: false
      # quick-fixes available in Ultimate and Ultimate Plus plans
      push-fixes: 'none'

qodana:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

image: maven:3.9-eclipse-temurin-17

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  paths:
    - .m2/repository

stages:
  - test
  - build

# Étape 1 : Tests Unitaires
test_job:
  stage: test
  script:
    - mvn clean test

# Étape 2 : Construction de l'image Docker
docker_build_job:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -t ismb-backend .
  only:
    - main
    - master
